name: Changesets

on:
  schedule:
    - cron: '0 0 * * *'

  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  CI: true
  PNPM_CACHE_FOLDER: .pnpm-store
  PNPM_CONFIG_PROVENANCE: 'true'

jobs:
  # Open/refresh the "build: release packages" version PR from changesets.
  # Runs freely on every push/cron (no environment gate, no publish).
  version:
    timeout-minutes: 14
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.repository == 'verdaccio/verdaccio-google-cloud'
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - name: checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
      - name: install pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack install
      - name: install dependencies
        run: pnpm install
      - name: build
        run: pnpm build
      - name: create versions
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.CHANGESET_RELEASE_TOKEN }}
          version-script: pnpm ci:version
          commit-message: 'build: release packages'
          pr-title: 'build: release packages'
          push-with-git-cli: true

  # Publish to npm once the version PR has been merged (no changesets left).
  # Gated by the `npm` environment, which requires manual approval.
  # Skipped on the daily cron so it never nags when there is nothing to publish.
  publish:
    needs: version
    if: needs.version.outputs.has-changesets == 'false' && github.event_name != 'schedule'
    timeout-minutes: 14
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
      - name: install pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack install
      - name: install dependencies
        run: pnpm install
      - name: build
        run: pnpm build
      - name: publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.CHANGESET_RELEASE_TOKEN }}
          publish-script: pnpm ci:publish
          create-github-releases: true
          push-git-tags: true
          push-with-git-cli: true
        env:
          PNPM_CONFIG_REGISTRY: https://registry.npmjs.org
