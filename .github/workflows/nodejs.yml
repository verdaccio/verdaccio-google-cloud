name: Node CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify ESM output
        run: |
          node -e "
            import('fs').then(fs => {
              const esm = fs.readFileSync('./lib/index.js', 'utf8');
              if (!esm.includes('GoogleCloudDatabase') || !esm.includes('GoogleCloudStorageHandler')) process.exit(1);
              if (!esm.includes('export {')) process.exit(1);
              console.log('ESM bundle verified');
            });
          "

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Cypress binary
        run: pnpm cypress install

      - name: Build Docker image
        run: docker compose build verdaccio

      - name: Start services
        run: docker compose up -d

      - name: Wait for Verdaccio
        run: |
          echo "Waiting for Verdaccio to be healthy..."
          for i in $(seq 1 60); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q verdaccio)" 2>/dev/null || echo "starting")
            echo "  attempt $i: $STATUS"
            [ "$STATUS" = "healthy" ] && echo "Verdaccio ready" && exit 0
            sleep 2
          done
          echo "Verdaccio failed to become healthy"
          docker compose logs verdaccio
          exit 1

      - name: Verify plugin loaded
        run: |
          docker compose logs verdaccio 2>&1
          docker compose logs verdaccio 2>&1 | grep -q "google-cloud"

      - name: E2E UI - publish tests (Cypress)
        run: pnpm e2e:ui:run
        env:
          VERDACCIO_URL: http://localhost:4873

      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/videos
            cypress/screenshots
          retention-days: 7

      # after Cypress on purpose: the UI detail suite opens the first package in the
      # list, and the battery leaves dozens of them behind
      - name: E2E - registry battery (@verdaccio/e2e-cli)
        run: pnpm e2e:registry --pm npm --pm pnpm

      - name: Verdaccio logs on failure
        if: failure()
        run: docker compose logs verdaccio

      - name: Stop services
        if: always()
        run: docker compose down -v
