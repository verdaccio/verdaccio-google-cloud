storage: /verdaccio/storage

plugins: /verdaccio/plugins

# the e2e battery publishes tarballs larger than the 10mb default
max_body_size: 100mb

store:
  google-cloud:
    bucket: GCS_BUCKET
    projectId: GOOGLE_CLOUD_PROJECT
    apiEndpoint: GCS_API_ENDPOINT
    datastoreEndpoint: DATASTORE_ENDPOINT

# no uplink on purpose: the e2e battery only ever uses packages it publishes itself, and
# proxying to npmjs made every lookup a network round trip, which hung /-/v1/search
packages:
  '@*/*':
    access: $all
    publish: $all
  '**':
    access: $all
    publish: $all

log:
  - {type: stdout, format: pretty, level: trace}

listen:
  - 0.0.0.0:4873

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
